[package]
name = "companion"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "system-tray",
  "window-all",
  "shell-open",
] }
rusqlite      = { version = "0.31", features = ["bundled"] }
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

[features]
default        = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto       = true
codegen-units = 1
strip     = true
